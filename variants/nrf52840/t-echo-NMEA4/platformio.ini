[env:t-echo-NMEA4]
extends = env:t-echo

custom_meshtastic_display_name = LILYGO T-Echo NMEA4

build_flags =
    ; Only GPS/TinyGPS override existing headers.
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/gps

    ; External replacement .cpp files must still be able to find the ORIGINAL
    ; Meshtastic sibling headers.
    -Isrc/graphics
    -Isrc/graphics/draw
    -Isrc/motion
    -Isrc
    ${env:t-echo.build_flags}
    -DTTGO_T_ECHO_NMEA4_FAMILY=1
    -DTTGO_T_ECHO_NMEA4=1

build_src_filter =
    ${env:t-echo.build_src_filter}

    ; Replace the original translation units directly.  This is deterministic
    ; and avoids relying on Build Middleware path matching.
    -<gps/GPS.cpp>
    -<gps/TinyGPS++.cpp>
  ;  -<motion/ICM20948Sensor.cpp>
    -<graphics/Screen.cpp>
  ;  -<graphics/draw/UIRenderer.cpp>

    ; Add the isolated NMEA4 implementations.  The graphics directory contains
    ; Screen.cpp, draw/UIRenderer.cpp and the NMEA4-only SatellitesRenderer.cpp.
    +<../variants/nrf52840/t-echo-NMEA4-common/src/gps>
  ;  +<../variants/nrf52840/t-echo-NMEA4-common/src/motion>
    +<../variants/nrf52840/t-echo-NMEA4-common/src/graphics>

lib_ignore =
    TinyGPSPlus
