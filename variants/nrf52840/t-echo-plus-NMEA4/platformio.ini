[env:t-echo-plus-NMEA4]
extends = env:t-echo-plus

; Same physical hardware identity as the normal T-Echo Plus.
; DRV2605 / haptic / buzzer / battery handling remain inherited from t-echo-plus.
custom_meshtastic_display_name = LILYGO T-Echo Plus NMEA4

; Preserve the inherited nRF52/nRF52840 script chain (UF2 generation, LTO
; protection, warm-region guard, etc.) and add the NMEA4 graphics replacement
; middleware. Screen.cpp and UIRenderer.cpp remain present in the inherited
; source filter, but their build nodes are replaced before compilation.
extra_scripts =
    ${nrf52_base.extra_scripts}
    pre:variants/nrf52840/t-echo-NMEA4-common/nmea4_graphics_replace.py

build_flags =
    ; NMEA4 replacement headers first
    ;-Ivariants/nrf52840/t-echo-NMEA4-common/include
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/gps
   ; -Ivariants/nrf52840/t-echo-NMEA4-common/include/graphics
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/graphics/draw
    -Ivariants/nrf52840/t-echo-NMEA4-common/include/motion

    ; Bridge back to the original Meshtastic sibling-header directories.
    ; The NMEA4 .cpp/.h files were moved out of src/, so quoted includes such
    ; as "EInkDisplay2.h", "CompassRenderer.h" and "MotionSensor.h" no longer
    ; get their original source-directory lookup automatically.
    -Isrc
    -Isrc/gps
    -Isrc/graphics
    -Isrc/graphics/draw
    -Isrc/motion
    ${env:t-echo-plus.build_flags}
    -DT_ECHO_NMEA4_FAMILY=1
    -DT_ECHO_PLUS_NMEA4=1

build_src_filter =
    ${env:t-echo-plus.build_src_filter}
    -<gps/GPS.cpp>
    -<gps/TinyGPS++.cpp>
   ; -<graphics/Screen.cpp>
    -<graphics/draw/UIRenderer.cpp>
    -<motion/ICM20948Sensor.cpp>
    +<../variants/nrf52840/t-echo-NMEA4-common/src/gps>
    +<../variants/nrf52840/t-echo-NMEA4-common/src/motion>
   ; +<../variants/nrf52840/t-echo-NMEA4-common/src/graphics>
    +<../variants/nrf52840/t-echo-NMEA4-common/src/graphics/draw/SatellitesRenderer.cpp>

 ; IMPORTANT:
    ; Do NOT add the NMEA4 graphics directory here.
    ; Screen.cpp and UIRenderer.cpp are replaced by nmea4_graphics_replace.py.

; The NMEA4 parser is compiled from the common source tree.
lib_ignore =
    TinyGPSPlus
